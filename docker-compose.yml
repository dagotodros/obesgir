services:

  nginx:
    image: nginx:latest
    depends_on:
      - php
    volumes:
      - ./docker/nginx/templates:/etc/nginx/templates
      - ${APP_PATH:-./}:/var/www/html
    environment:
      - ROOT_DIR=${DOCUMENT_ROOT:-public}
      - PHP_FPM=php
    ports:
      - "8080:80"

  php:
    build:
      context: ./docker/php
      args:
        - php_version=${PHP_VERSION:-8.1}
        - composer_version=${COMPOSER_VERSION:-2.5}
        - uid=${MYUID:-1000}
        - gid=${GID:-1000}
        - user=${USER}
    volumes:
      - ${APP_PATH:-./}:/var/www/html
      - ${SSH_AUTH_SOCK}:/run/host-services/ssh-auth.sock
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      - ${HOME}/.ssh:${HOME}/.ssh:ro
    environment:
      - SSH_AUTH_SOCK=/run/host-services/ssh-auth.sock

  pgsql:
    image: postgres:14.5
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "54320:5432"
